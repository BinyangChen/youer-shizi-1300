<script>
(function(){
  var CHARS = (window.SHIZI_CHARS || "").split("");
  var TOTAL = CHARS.length;
  var PER = 10;
  var PAGES = Math.ceil(TOTAL / PER);
  var mastered = new Set();
  var cur = 0;

  function $(s){ return document.querySelector(s); }
  function storeKey(){
    var p = new URLSearchParams(location.search);
    var b = p.get("book");
    if(b) return "shizi1300_book_" + b;
    var base = location.origin + location.pathname + location.search;
    var h = 0;
    for(var i=0;i<base.length;i++){ h = (h*31 + base.charCodeAt(i)) >>> 0; }
    return "shizi1300_" + h.toString(36);
  }
  var KEY = storeKey();

  function load(){
    try{
      var raw = JSON.parse(localStorage.getItem(KEY) || "[]");
      if(Array.isArray(raw) && raw.length && typeof raw[0] === "number"){
        // 兼容旧版：下标存储 -> 转为字符存储（顺序无关，便于重排）
        mastered = new Set(raw.map(function(i){ return CHARS[i]; }).filter(Boolean));
      } else {
        mastered = new Set(raw);
      }
    }catch(e){ mastered = new Set(); }
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(Array.from(mastered))); }catch(e){}
  }

  function updateStats(){
    var m = mastered.size;
    $("#cMastered").textContent = m;
    $("#cPending").textContent = TOTAL - m;
    $("#cTotal").textContent = TOTAL;
    $("#badgeLib").textContent = m;
    $("#badgePend").textContent = TOTAL - m;
    $("#pageAll").textContent = PAGES;
    $("#bar").style.width = (TOTAL ? (m/TOTAL*100) : 0) + "%";
  }

  function pop(el){
    if(el && el.animate){
      el.animate([{transform:"scale(1)"},{transform:"scale(1.12)"},{transform:"scale(1)"}],{duration:220});
    }
  }

  function renderStudy(){
    var grid = $("#grid");
    grid.innerHTML = "";
    var start = cur * PER;
    for(var i=start; i<start+PER && i<TOTAL; i++){
      (function(idx){
        var b = document.createElement("button");
        b.className = "card" + (mastered.has(CHARS[idx]) ? " done" : "");
        b.innerHTML = '<span class="ch">'+CHARS[idx]+'</span><span class="box"></span>';
        b.addEventListener("click", function(){ toggle(idx, b); });
        grid.appendChild(b);
      })(i);
    }
    $("#pageNo").textContent = cur + 1;
  }

  function toggle(i, el){
    var ch = CHARS[i];
    if(mastered.has(ch)){ mastered.delete(ch); if(el) el.classList.remove("done"); }
    else { mastered.add(ch); if(el){ el.classList.add("done"); pop(el); } checkPageDone(); }
    save(); updateStats();
  }

  function checkPageDone(){
    var start = cur*PER, all = true;
    for(var i=start; i<start+PER && i<TOTAL; i++){ if(!mastered.has(CHARS[i])){ all=false; break; } }
    if(all) toast("这一页都认识啦 🎉");
  }

  function renderLib(){
    var w = $("#libWrap"); w.innerHTML = "";
    var list = Array.from(mastered).sort(function(a,b){ return CHARS.indexOf(a) - CHARS.indexOf(b); });
    $("#libEmpty").hidden = list.length > 0;
    list.forEach(function(ch){
      var s = document.createElement("span");
      s.className = "chip lib"; s.textContent = ch;
      s.title = "点击取消已认识";
      s.addEventListener("click", function(){
        mastered.delete(ch); save(); updateStats(); renderLib(); renderStudy(); toast("已移回待完成");
      });
      w.appendChild(s);
    });
  }

  function renderPend(){
    var w = $("#pendWrap"); w.innerHTML = "";
    var list = [];
    for(var i=0;i<TOTAL;i++){ if(!mastered.has(CHARS[i])) list.push(CHARS[i]); }
    $("#pendEmpty").hidden = list.length > 0;
    list.forEach(function(ch){
      var s = document.createElement("span");
      s.className = "chip pend"; s.textContent = ch;
      s.title = "点击标记为已认识";
      s.addEventListener("click", function(){
        mastered.add(ch); save(); updateStats(); renderPend(); renderStudy(); pop(s);
      });
      w.appendChild(s);
    });
  }

  function gotoFirstPending(){
    var idx = -1;
    for(var i=0;i<TOTAL;i++){ if(!mastered.has(CHARS[i])){ idx=i; break; } }
    if(idx < 0){ toast("全部认识啦 🎉"); return; }
    cur = Math.floor(idx / PER);
    switchTab("study");
    renderStudy();
  }

  function switchTab(t){
    document.querySelectorAll(".panel").forEach(function(p){ p.classList.remove("active"); });
    document.querySelectorAll(".tab").forEach(function(b){ b.classList.remove("active"); });
    $("#"+t).classList.add("active");
    document.querySelector('.tab[data-tab="'+t+'"]').classList.add("active");
    if(t === "lib") renderLib();
    if(t === "pend") renderPend();
  }

  var toastT;
  function toast(msg){
    var t = $("#toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove("show"); }, 1600);
  }

  $("#prev").onclick = $("#prev2").onclick = function(){ if(cur>0){ cur--; renderStudy(); } };
  $("#next").onclick = $("#next2").onclick = function(){ if(cur<PAGES-1){ cur++; renderStudy(); } };
  $("#allYes").onclick = function(){
    var s = cur*PER;
    for(var i=s;i<s+PER && i<TOTAL;i++){ mastered.add(CHARS[i]); }
    save(); updateStats(); renderStudy(); toast("本页已全认识 👍");
  };
  $("#allNo").onclick = function(){
    var s = cur*PER;
    for(var i=s;i<s+PER && i<TOTAL;i++){ mastered.delete(CHARS[i]); }
    save(); updateStats(); renderStudy();
  };
  $("#continue").onclick = gotoFirstPending;
  document.querySelectorAll(".tab").forEach(function(b){ b.onclick = function(){ switchTab(b.dataset.tab); }; });
  $("#reset").onclick = function(){
    if(confirm("确定清空本机本链接的识字进度吗？此操作不可恢复。")){
      mastered.clear(); save(); updateStats(); renderStudy(); renderLib(); renderPend(); toast("已重置");
    }
  };

  load(); updateStats(); renderStudy();
})();
</script>
</body>
</html>
